<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Sensor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .card .value {
            font-size: 3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .card .unit {
            color: #666;
            font-size: 1.2em;
        }
        
        .card .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }
        
        .status {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .status.connected {
            border-left: 5px solid #4caf50;
        }
        
        .status.disconnected {
            border-left: 5px solid #f44336;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ ESP32 Sensor Dashboard</h1>
        
        <div id="loading" class="loading">Loading sensor data...</div>
        
        <div id="content" style="display: none;">
            <div class="dashboard">
                <div class="card">
                    <h2>🌡️ Temperature</h2>
                    <div class="value" id="temperature">--</div>
                    <div class="unit">°C</div>
                </div>
                
                <div class="card">
                    <h2>💧 Humidity</h2>
                    <div class="value" id="humidity">--</div>
                    <div class="unit">%</div>
                </div>
                
                <div class="card">
                    <h2>🌤️ Pressure</h2>
                    <div class="value" id="pressure">--</div>
                    <div class="unit">hPa</div>
                </div>
            </div>
            
            <div class="status" id="status">
                <p id="statusText">Waiting for data...</p>
                <p class="timestamp" id="lastUpdate">Last update: Never</p>
            </div>
        </div>
    </div>
    
    <script>
        function updateDashboard() {
            fetch('/api/sensor-data/latest')
                .then(response => response.json())
                .then(result => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    
                    if (result.data) {
                        const data = result.data;
                        
                        document.getElementById('temperature').textContent = 
                            (data.temperature != null ? data.temperature.toFixed(1) : '--');
                        document.getElementById('humidity').textContent = 
                            (data.humidity != null ? data.humidity.toFixed(1) : '--');
                        document.getElementById('pressure').textContent = 
                            (data.pressure != null ? data.pressure.toFixed(1) : '--');
                        
                        const timestamp = new Date(data.server_timestamp);
                        document.getElementById('lastUpdate').textContent = 
                            'Last update: ' + timestamp.toLocaleString();
                        
                        const status = document.getElementById('status');
                        status.className = 'status connected';
                        document.getElementById('statusText').textContent = 
                            '✅ Connected - Receiving data';
                    } else {
                        document.getElementById('statusText').textContent = 
                            '⏳ Waiting for first data packet...';
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    
                    const status = document.getElementById('status');
                    status.className = 'status disconnected';
                    document.getElementById('statusText').textContent = 
                        '❌ Connection error';
                });
        }
        
        // Update dashboard every 2 seconds
        updateDashboard();
        setInterval(updateDashboard, 2000);
    </script>
</body>
</html>
